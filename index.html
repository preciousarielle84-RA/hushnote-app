<script>
  // Configuration Supabase
  const SUPABASE_URL = "https://xaetcojuoooqtbdcuyso.supabase.co";
  const SUPABASE_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InhhZXRjb2p1b29vcXRiZGN1eXNvIiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTExMTMyNTUsImV4cCI6MjEwNjY4OTI1NX0.CxnV-2j0ZLugiQiWnyxvAdeAAEm3Gb7gLtCP3KwJhDk";
  const supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

  // Charger les messages au démarrage
  document.addEventListener('DOMContentLoaded', chargerMessages);

  async function chargerMessages() {
    const { data: messages, error } = await supabaseClient
      .from('messages')
      .select('*')
      .order('created_at', { ascending: false });

    if (error) {
      console.error("Erreur de chargement :", error);
      return;
    }

    const box = document.getElementById('messagesList');
    box.innerHTML = '';

    if (!messages || messages.length === 0) {
      box.innerHTML = '<div id="emptyMsg" style="color: #888; text-align: center; margin-top: 80px; font-size: 13px;">Aucun message pour le moment.</div>';
      return;
    }

    messages.forEach(msg => afficherMessage(msg));
  }

  async function envoyerMessage(event) {
    event.preventDefault();
    const input = document.getElementById('msgInput');
    const texte = input.value.trim();

    if (!texte) return;

    const { data, error } = await supabaseClient
      .from('messages')
      .insert([{ content: texte }])
      .select();

    if (error) {
      alert("Erreur lors de l'envoi : " + error.message);
      return;
    }

    input.value = '';
    chargerMessages();
  }

  async function supprimerParExpediteur(id) {
    const { error } = await supabaseClient
      .from('messages')
      .update({ is_deleted: true })
      .eq('id', id);

    if (error) {
      alert("Erreur lors de la suppression : " + error.message);
      return;
    }

    chargerMessages();
  }

  function afficherMessage(msg) {
    const box = document.getElementById('messagesList');
    const newItem = document.createElement('div');
    newItem.className = 'message-item';

    if (!msg.is_deleted) {
      newItem.innerHTML = `
        <div style="font-weight: bold; color: #007bff; margin-bottom: 4px;">💬 Message Reçu</div>
        <div>${msg.content}</div>
        <button type="button" class="btn-delete-sender" onclick="supprimerParExpediteur(${msg.id})">🗑️️ Supprimer le message (Côté expéditeur)</button>
      `;
    } else {
      newItem.innerHTML = `
        <div style="font-weight: bold; color: #555; margin-bottom: 4px;">💬 Message Reçu</div>
        <div class="deleted-notice">
          ⚠️️ <i>L'expéditeur a supprimé ce message.</i>
        </div>
        <button type="button" class="btn-unlock" onclick="payerAbonnement()">🔓 Débloquer et lire le message supprimé (640 XAF)</button>
      `;
    }

    box.appendChild(newItem);
  }

  function payerAbonnement() {
    window.location.href = "https://ici-y-a-tout.mymaketou.shop/products/ia-business-le-guide-pour-generer-des-revenus/checkout"; 
  }
    </script>
