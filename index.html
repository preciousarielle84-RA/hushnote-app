<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Hushnote - Messagerie Anonyme VIP</title>
  <style>
    body { font-family: Arial, sans-serif; background: #f0f2f5; margin: 0; padding: 20px; display: flex; justify-content: center; }
    .card { background: white; padding: 20px; border-radius: 12px; box-shadow: 0 4px 10px rgba(0,0,0,0.1); max-width: 400px; width: 100%; text-align: center; }
    h2 { color: #1a73e8; margin-top: 0; }
    textarea { width: 100%; height: 80px; padding: 10px; border: 1px solid #ccc; border-radius: 8px; resize: none; box-sizing: border-box; }
    button { width: 100%; padding: 12px; margin-top: 10px; border: none; border-radius: 8px; background: #1a73e8; color: white; font-weight: bold; cursor: pointer; }
    button:active { background: #1557b0; }
    .btn-recover { background: #00838f; margin-top: 15px; }
    .messages-list { margin-top: 20px; text-align: left; }
    .message-item { background: #e8f0fe; padding: 10px; border-radius: 6px; margin-bottom: 8px; font-size: 14px; color: #333; }
  </style>
</head>
<body>

<div class="card">
  <h2>🔒 Hushnote</h2>
  <p>Envoie un message anonyme :</p>
  
  <textarea id="msgInput" placeholder="Écris ton message..."></textarea>
  <button onclick="envoyerMessage()">Envoyer</button>

  <div class="messages-list" id="messagesList"></div>

  <button class="btn-recover" onclick="recupererMessagesSupprimes()">🔄 Récupérer les messages supprimés</button>
</div>

<script>
  let messagesLocaux = [];

  async function chargerMessages() {
    try {
      const res = await fetch('/api/messages');
      const data = await res.json();
      if (Array.isArray(data)) {
        messagesLocaux = data;
        afficherMessages();
      }
    } catch (e) {
      console.error(e);
    }
  }

  function afficherMessages() {
    const list = document.getElementById('messagesList');
    list.innerHTML = '';
    messagesLocaux.forEach(m => {
      const div = document.createElement('div');
      div.className = 'message-item';
      div.textContent = m.content || m.texte || m;
      list.appendChild(div);
    });
  }

  async function envoyerMessage() {
    const input = document.getElementById('msgInput');
    const texte = input.value.trim();
    if (!texte) return alert("Veuillez écrire un message.");

    // Ajout instantané à l'écran
    messagesLocaux.push({ content: texte });
    afficherMessages();
    input.value = '';

    // Envoi au serveur
    try {
      await fetch('/api/messages', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ content: texte })
      });
    } catch (e) {
      console.error(e);
    }
  }

  async function recupererMessagesSupprimes() {
    try {
      const res = await fetch('/api/messages-deleted');
      const data = await res.json();
      
      if (!data || data.length === 0) {
        alert("ℹ️ Aucun message à récupérer.");
      } else {
        alert("🔒 ACCÈS REFUSÉ !\n\nVous devez obligatoirement souscrire à l'abonnement VIP (640 XAF / mois) avant de pouvoir récupérer les messages supprimés.");
      }
    } catch (e) {
      alert("ℹ️ Aucun message à récupérer.");
    }
  }

  // Chargement initial des messages
  chargerMessages();
</script>

</body>
</html>
